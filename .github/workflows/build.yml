name: Build Rail Link app

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # The signing key is stored encrypted in signing/release.jks.enc.
      # It can only be unlocked with the SIGNING_PASSWORD repository secret.
      - name: Unlock signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::The SIGNING_PASSWORD secret is missing, so the app can't be signed. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" \
            -pass env:SIGNING_PASSWORD

      - name: Build signed APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: raillink
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk RailLink.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          printf '%s\n' "${COMMIT_MSG:-New version}" > notes.txt
          gh release create "$TAG" RailLink.apk \
            --title "Rail Link $TAG" \
            --notes-file notes.txt \
            --latest

      - name: Keep a copy of the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: RailLink-apk
          path: RailLink.apk
